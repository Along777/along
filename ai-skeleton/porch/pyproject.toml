[project]
name = "skeleton-porch"
version = "0.1.0"
description = "AI porch skeleton, the porch side: camera, person detection, mic, speaker, kill switch."
requires-python = ">=3.12,<3.13"
dependencies = [
  "ultralytics>=8.4",
  "opencv-python>=4.10",
  "numpy>=2.0.2",
  "scipy>=1.13",
  "sounddevice>=0.5",
  "requests>=2.31",
  "pynput>=1.7",
  "pygrabber>=0.2; sys_platform == 'win32'",
]

[project.scripts]
skeleton-porch = "skeleton_porch.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["skeleton_porch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
