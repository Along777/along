[project]
name = "skeleton-brain"
version = "0.1.0"
description = "AI porch skeleton, the brain: costume line, speech-to-text, in-character reply, voice."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "numpy>=2.0.2",
  "scipy>=1.13",
  "onnx-asr[cpu,hub]>=0.12",
  "kokoro-onnx>=0.6.1",
  "pedalboard>=0.9.16",
]

[project.scripts]
skeleton-brain = "skeleton_brain.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["skeleton_brain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
