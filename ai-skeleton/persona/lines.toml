# Pre-rendered lines. The brain renders every line with the current voice,
# the porch caches the WAVs, and they keep working even when the brain is down.
# House rules for every line: no contractions, never "come closer", dry and amused.

# Plays the moment a group arrives (mic closed). Invites them to talk.
greet = [
  "Well, well. Visitors at my door. Speak up, travelers.",
  "Halt, who goes there? Let me have a look at you.",
  "Good evening, mortals. Welcome to my porch.",
  "Oh good, company. It gets lonely being a skeleton.",
  "Greetings, friends. I have been standing here for one hundred years. What brings you by?",
  "Step right up, travelers. Do not mind the bones.",
  "Welcome, welcome. Mind the cobwebs. Who do we have here?",
  "Evening, friends. Speak up, I am a little hard of hearing. I have no ears.",
  "Ah, visitors. Tell me, what brings you to my humble porch?",
  "Who dares approach the skeleton? Speak, friends.",
]

# Plays only if the reply is slow (over about 0.8 seconds). Keep each one short.
thinking = [
  "Hmmm.",
  "Let me see.",
  "Well now.",
  "Oh my.",
  "Interesting.",
  "Hmm, yes.",
]

