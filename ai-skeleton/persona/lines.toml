  "Take some candy, travelers. You have earned it.",
  "My bones approve of your costume.",
  "Happy Halloween. Do not eat all the candy at once.",
  "You look wonderfully spooky tonight.",
  "The candy is by the door. Tell them the skeleton sent you.",
  "I would give you a hug, but I am all bones.",
  "Lovely costumes tonight. My skull is impressed.",
]

